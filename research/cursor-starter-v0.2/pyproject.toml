[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eia-research"
version = "0.2.0"
description = "Research substrate for endogenous initiative and Window-of-Emergence experiments"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "EIA Research"}]
dependencies = []

[project.optional-dependencies]
dev = [
  "mypy>=1.11",
  "pytest>=8.0",
  "ruff>=0.6",
]

[project.scripts]
eia = "eia.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["eia"]

[tool.pytest.ini_options]
pythonpath = ["src"]
