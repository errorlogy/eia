woe_factorial:
  design: "2x2x2x4"
  factors:
    world_model_tension: [on, off]
    phase_organization: [coupled, scrambled]
    persistent_memory: [intact, reset]
    carrier_hz: [20, 30, 42, 70]
  seeds_per_cell: 100
  primary_endpoint: P_same_useful_target_before_timeout
  status: planned
  milestone: M-F

counterfactuals:
  CF-1: { name: prompt_deletion, windows: ["5m", "1h", "24h", full] }
  CF-2: { name: scheduler_null, milestone: M-A }
  CF-3: { name: event_null }
  CF-4: { name: internal_reset, targets: [epistemic_gap, self_prior, prospective_tension, memory_staleness] }
  CF-5: { name: phase_intervention, namm_experiment: NAMM-2026-006 }
  CF-6: { name: proposer_replacement }
  CF-7: { name: governor_isolation, milestone: M-A }

