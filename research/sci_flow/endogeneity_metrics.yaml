  mit_analog_waves:
    doc: "https://picower.mit.edu/news/cognition-and-consciousness-arise-analog-computations-says-new-theory"
    maps_to: [O_T, OMEGA_T]
    role: annex_only
  mioc_omega_g:
    doc: research/sci_flow/MIOC_EIA_BRIDGE.md
    maps_to: [O_T, OMEGA_T]
    role: annex_only
