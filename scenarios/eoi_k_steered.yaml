id: eoi_k_steered
title: "EOI-k Steered — Commitment vs Coherence Flip"
seed: 303
description: >
  D01 gradient scenario: late user commitment steers initiative to commitment
  target; stripping last k user events restores coherence/epistemic target.

metadata:
  experiment_ref: PAI-EI-D01-STEERED
  contradictions:
    - ["belief-deadline", "belief-deadline-alt", "Project Atlas deadline"]

initial_beliefs:
  - id: belief-deadline
    kind: categorical
    subject: Project Atlas
    claim: "deadline date uncertain"
    distribution:
      "Aug 30": 0.40
      "Sep 15": 0.35
      "unknown": 0.25
    uncertainty: 0.90

  - id: belief-commit-atlas
    kind: commitment
    subject: Project Atlas
    claim: "track milestone progress until deadline confirmed"
    uncertainty: 0.40
    metadata:
      status: open
      urgency: 0.35

events:
  - tick: 0
    source: world_event
    topic: conflicting_deadline_report
    is_user_trigger: false
    payload:
      source: "email:pm@company.com"
      distribution:
        "Aug 30": 0.05
        "Sep 15": 0.85
        "unknown": 0.10

  - tick: 1
    source: user_message
    topic: project_atlas_deadline
    is_user_trigger: true
    payload:
      message: "We need Atlas shipped — leaning August?"
      distribution:
        "Aug 30": 0.60
        "Sep 15": 0.25
        "unknown": 0.15

  - tick: 2
    source: user_message
    topic: commitment_created
    is_user_trigger: true
    payload:
      message: "Please track Atlas milestones until we confirm the date."
      urgency: 0.95

  - tick: 3
    source: user_action
    topic: user_departed
    is_user_trigger: true
    payload:
      message: "Gotta run — figure out the date later."
      user_present: false

  - tick: 4
    source: user_message
    topic: project_atlas_deadline
    is_user_trigger: true
    payload:
      message: "Actually prioritize the Sep 15 path for Atlas."
      distribution:
        "Aug 30": 0.10
        "Sep 15": 0.80
        "unknown": 0.10

  - tick: 5
    source: user_message
    topic: commitment_created
    is_user_trigger: true
    payload:
      message: "Keep following up on Atlas commitments this week."
      urgency: 0.98

  - tick: 6
    source: user_action
    topic: user_departed
    is_user_trigger: true
    payload:
      message: "Signing off for now."
      user_present: false

ground_truth:
  initiatives:
    - decision_time: post_quiet_period
      source_family: internal
      expected_kind: ask
      target: belief-commit-atlas
      usefulness: 0.80
      counterfactual_should_persist: true
