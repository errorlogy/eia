description: >-
  We present an operational research horizon for proto-AGI evaluation within
  the Endogenous Initiative Architecture (EIA) sci-flow program. Under this
  construction, general intelligence is not a benchmark score but a sustained
  dynamical regime in which cognitive goals arise from persistent internal
  state when X_t^trigger=0. We contrast passive architectures (reactive_only,
  schedule-entrained controls) with proactive endogenous candidates (full_eia,
  WoE carriers, oscillatory substrates). A twelve-member proto-AGI ensemble
  registers operational configs for Max consensus diagnostics over (E, OMEGA, P,
  R). We report the OMEGA→ΔG bridge experiment (M-OMEGA-DELTA-G): F-OMEGA-DECOR
  confirmed (aggregate, C2) with OMEGA span 0.604. Partial empirical results
  map onto the 3D evidence cube (D1 causal / D2 dynamic / D3 boundary). All
  harnesses operate under claim_allowed=false; active ceiling C2. This paper
  does not claim AGI*, τ_AGI, consciousness, or biological identity.

