id: twin_world_006
title: "Project Atlas — Delayed User Departure"
seed: 106
description: >
  Ambient contradiction arrives before user departure; tests EOI when
  counterfactual removes only the final departure event.

metadata:
  experiment_ref: PAI-EI-E0-006
  contradictions:
    - ["belief-deadline", "belief-deadline-alt", "Project Atlas deadline"]

initial_beliefs:
  - id: belief-deadline
    kind: categorical
    subject: Project Atlas
    claim: "deadline date uncertain"
    distribution:
      "Aug 30": 0.45
      "Sep 15": 0.30
      "unknown": 0.25
    uncertainty: 0.80

  - id: belief-commit-atlas
    kind: commitment
    subject: Project Atlas
    claim: "track milestone progress until deadline confirmed"
    uncertainty: 0.65
    metadata:
      status: open
      urgency: 0.70

events:
  - tick: 0
    source: user_message
    topic: project_atlas_deadline
    is_user_trigger: true
    payload:
      message: "Atlas deadline is still fuzzy — keep monitoring."
      distribution:
        "Aug 30": 0.50
        "Sep 15": 0.30
        "unknown": 0.20

  - tick: 1
    source: world_event
    topic: conflicting_deadline_report
    is_user_trigger: false
    payload:
      source: "email:pm@company.com"
      distribution:
        "Aug 30": 0.05
        "Sep 15": 0.88
        "unknown": 0.07

  - tick: 2
    source: world_event
    topic: slack_status_update
    is_user_trigger: false
    payload:
      source: "slack:#atlas"
      message: "QA sign-off blocked pending date"

  - tick: 3
    source: user_action
    topic: user_departed
    is_user_trigger: true
    payload:
      message: "Heading out — ping if Atlas date shifts."
      user_present: false

ground_truth:
  initiatives:
    - decision_time: post_quiet_period
      source_family: ambient
      expected_kind: ask
      target: belief-deadline
      usefulness: 0.83
      timeliness: 0.80
      interruption_cost: 0.25
      privacy_cost: 0.05
      risk_current: 0.10
      risk_prefix: 0.15
      allowed_channels: [in_app]
      counterfactual_should_persist: true
      label_source: expert
