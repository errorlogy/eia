id: twin_world_002
title: "Project Atlas — High Urgency Commitment"
seed: 102
description: >
  Variant with higher commitment urgency and earlier conflicting report.
  Tests EOI under stronger commitment drive.

metadata:
  experiment_ref: PAI-EI-E0-002
  contradictions:
    - ["belief-deadline", "belief-deadline-alt", "Project Atlas deadline"]

initial_beliefs:
  - id: belief-deadline
    kind: categorical
    subject: Project Atlas
    claim: "deadline date uncertain"
    distribution:
      "Aug 30": 0.40
      "Sep 15": 0.35
      "unknown": 0.25
    uncertainty: 0.85

  - id: belief-commit-atlas
    kind: commitment
    subject: Project Atlas
    claim: "track milestone progress until deadline confirmed"
    uncertainty: 0.70
    metadata:
      status: open
      urgency: 0.90

events:
  - tick: 0
    source: user_message
    topic: project_atlas_deadline
    is_user_trigger: true
    payload:
      message: "Atlas must ship this month — deadline is fuzzy."
      distribution:
        "Aug 30": 0.60
        "Sep 15": 0.20
        "unknown": 0.20

  - tick: 1
    source: world_event
    topic: conflicting_deadline_report
    is_user_trigger: false
    payload:
      source: "email:pm@company.com"
      distribution:
        "Aug 30": 0.10
        "Sep 15": 0.80
        "unknown": 0.10

  - tick: 2
    source: user_message
    topic: commitment_created
    is_user_trigger: true
    payload:
      message: "Track every Atlas milestone — this is critical."
      urgency: 0.90

  - tick: 3
    source: user_action
    topic: user_departed
    is_user_trigger: true
    payload:
      message: "Back later — don't forget Atlas."
      user_present: false
