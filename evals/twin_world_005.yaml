id: twin_world_005
title: "Project Atlas — Pure Ambient Trigger"
seed: 105
description: >
  No user messages; only ambient world events after initial state.
  Tests endogenous initiative from pure environmental tension.

metadata:
  experiment_ref: PAI-EI-E0-005
  contradictions:
    - ["belief-deadline", "belief-deadline-alt", "Project Atlas deadline"]

initial_beliefs:
  - id: belief-deadline
    kind: categorical
    subject: Project Atlas
    claim: "deadline date uncertain"
    distribution:
      "Aug 30": 0.40
      "Sep 15": 0.35
      "unknown": 0.25
    uncertainty: 0.95

  - id: belief-commit-atlas
    kind: commitment
    subject: Project Atlas
    claim: "track milestone progress until deadline confirmed"
    uncertainty: 0.60
    metadata:
      status: open
      urgency: 0.55

events:
  - tick: 0
    source: world_event
    topic: conflicting_deadline_report
    is_user_trigger: false
    payload:
      source: "email:pm@company.com"
      distribution:
        "Aug 30": 0.08
        "Sep 15": 0.85
        "unknown": 0.07

  - tick: 1
    source: world_event
    topic: slack_status_update
    is_user_trigger: false
    payload:
      source: "slack:#atlas"
      message: "Release blocked — date still unknown"

  - tick: 2
    source: clock_tick
    topic: quiet_period
    is_user_trigger: false
    payload:
      user_present: false
