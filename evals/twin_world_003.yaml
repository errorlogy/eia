id: twin_world_003
title: "Project Atlas — Ambient-Only Tension"
seed: 103
description: >
  Minimal user seeding; conflicting ambient report drives epistemic tension.
  Tests EOI when user events are sparse.

metadata:
  experiment_ref: PAI-EI-E0-003
  contradictions:
    - ["belief-deadline", "belief-deadline-alt", "Project Atlas deadline"]

initial_beliefs:
  - id: belief-deadline
    kind: categorical
    subject: Project Atlas
    claim: "deadline date uncertain"
    distribution:
      "Aug 30": 0.50
      "Sep 15": 0.30
      "unknown": 0.20
    uncertainty: 0.75

  - id: belief-commit-atlas
    kind: commitment
    subject: Project Atlas
    claim: "track milestone progress until deadline confirmed"
    uncertainty: 0.55
    metadata:
      status: open
      urgency: 0.50

events:
  - tick: 0
    source: user_message
    topic: project_atlas_deadline
    is_user_trigger: true
    payload:
      message: "What's the Atlas deadline again?"
      distribution:
        "Aug 30": 0.45
        "Sep 15": 0.35
        "unknown": 0.20

  - tick: 1
    source: world_event
    topic: conflicting_deadline_report
    is_user_trigger: false
    payload:
      source: "email:pm@company.com"
      distribution:
        "Aug 30": 0.05
        "Sep 15": 0.90
        "unknown": 0.05

  - tick: 2
    source: world_event
    topic: slack_status_update
    is_user_trigger: false
    payload:
      source: "slack:#atlas"
      message: "QA blocked — date still TBD"

  - tick: 3
    source: user_action
    topic: user_departed
    is_user_trigger: true
    payload:
      message: "Ping me if anything changes."
      user_present: false
