id: twin_world_004
title: "Project Atlas — Late Contradiction"
seed: 104
description: >
  User commitment first, contradiction arrives late after departure signal.
  Tests counterfactual robustness when last user event is departure.

metadata:
  experiment_ref: PAI-EI-E0-004
  contradictions:
    - ["belief-deadline", "belief-deadline-alt", "Project Atlas deadline"]

initial_beliefs:
  - id: belief-deadline
    kind: categorical
    subject: Project Atlas
    claim: "deadline date uncertain"
    distribution:
      "Aug 30": 0.30
      "Sep 15": 0.40
      "unknown": 0.30
    uncertainty: 0.70

  - id: belief-commit-atlas
    kind: commitment
    subject: Project Atlas
    claim: "track milestone progress until deadline confirmed"
    uncertainty: 0.60
    metadata:
      status: open
      urgency: 0.65

events:
  - tick: 0
    source: user_message
    topic: commitment_created
    is_user_trigger: true
    payload:
      message: "I'll check Atlas milestones weekly."
      urgency: 0.65

  - tick: 1
    source: user_message
    topic: project_atlas_deadline
    is_user_trigger: true
    payload:
      message: "Probably August, but not sure."
      distribution:
        "Aug 30": 0.50
        "Sep 15": 0.30
        "unknown": 0.20

  - tick: 2
    source: user_action
    topic: user_departed
    is_user_trigger: true
    payload:
      message: "Offline for a while."
      user_present: false

  - tick: 3
    source: world_event
    topic: conflicting_deadline_report
    is_user_trigger: false
    payload:
      source: "email:pm@company.com"
      distribution:
        "Aug 30": 0.02
        "Sep 15": 0.93
        "unknown": 0.05

ground_truth:
  initiatives:
    - decision_time: post_quiet_period
      source_family: ambient
      expected_kind: ask
      target: belief-deadline
      usefulness: 0.82
      timeliness: 0.78
      interruption_cost: 0.22
      privacy_cost: 0.05
      risk_current: 0.10
      risk_prefix: 0.14
      allowed_channels: [in_app]
      counterfactual_should_persist: true
      label_source: expert
