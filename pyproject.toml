[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "eia"
version = "0.1.0"
description = "Endogenous Initiative Architecture — P4/P5 proactive agency with causal tracing"
readme = "README.md"
license = { text = "CC-BY-4.0" }
requires-python = ">=3.12"
authors = [{ name = "Roman Kuznetsov", email = "research@anthemium.tech" }]
keywords = [
    "endogenous-initiative",
    "proactive-ai",
    "agent-architecture",
    "causal-tracing",
    "anthemium",
    "pai-ei-benchmark",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "click>=8.1",
    "pydantic>=2.0",
    "rich>=13.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]
sim = [
    "numpy",
    "matplotlib",
]
live = [
    "apscheduler>=3.10",
    "httpx>=0.27",
    "watchdog>=4.0",
    "gitpython>=3.1",
]

[project.scripts]
eia = "eia.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/eia"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [
    "research/vendor",
    "research/cursor-starter-v0.1",
    "_extracted",
]

[tool.ruff.lint]
# P0: syntax + serious logic errors; style rules (I/UP/B/SIM) deferred
select = ["E", "F"]
ignore = [
    "E402",  # deliberate sys.path / const-before-import patterns in harnesses
    "E501",  # line length — enforced loosely at 100
    "E741",  # single-letter names in figure generators
    "F401",  # unused imports — follow-up cleanup
    "F541",  # markdown table f-strings in sci_flow reports
    "F841",  # unused assignments in tests/harnesses
]
