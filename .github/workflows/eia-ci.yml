name: EIA CI

on:
  push:
    branches:
      - main
      - research/cursor-starter-v0.2-woe-eis
  pull_request:
    branches:
      - main
      - research/cursor-starter-v0.2-woe-eis

jobs:
  ruff:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dev dependencies
        run: pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check src tests scripts research/sci_flow

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: ruff
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package
        run: pip install -e ".[dev,sim]"

      - name: Pytest (full suite)
        run: pytest -q

      - name: Replay re-execute smoke
        run: pytest tests/test_replay_reexecute.py -q

      # Main-only quality gates (seed / eval / trace) — not run on research branches
      - name: Seed determinism bootstrap (Loop 28)
        if: github.ref == 'refs/heads/main'
        env:
          EIA_CI_SEED_BOOTSTRAP: "1"
        run: python research/ci_seed_bootstrap.py

      - name: Eval suite quality gate (Loop 29)
        if: github.ref == 'refs/heads/main'
        env:
          EIA_CI_EVAL_GATE: "1"
        run: python research/ci_eval_gate.py

      - name: Structural trace diff gate
        if: github.ref == 'refs/heads/main'
        env:
          EIA_CI_TRACE_DIFF: "1"
        run: python research/ci_trace_diff_check.py
